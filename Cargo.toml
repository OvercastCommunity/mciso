[package]
name = "mciso"
version = "0.1.0"
edition = "2021"
description = "Render Minecraft Anvil worlds as cropped isometric images and thumbnails"
license = "MIT"
repository = "https://github.com/OvercastCommunity/mciso"
default-run = "mciso"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fastanvil = "0.31"
imagequant = "4"
png = "0.18"
rgb = "0.8"
fastnbt = "2"
rayon = "1"
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1.25"

aws-config = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"], optional = true }

[features]
upload = ["dep:aws-config", "dep:aws-sdk-s3", "dep:tokio"]

[[bin]]
name = "upload"
path = "src/bin/upload.rs"
required-features = ["upload"]

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]

[workspace]
exclude = ["vendor/fastanvil"]

[profile.release]
debug = 2
lto = "thin"

# Local fixes for legacy block metadata; see README.md.
[patch.crates-io]
fastanvil = { path = "vendor/fastanvil" }
